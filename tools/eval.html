<!doctype html>
<meta charset="utf-8">
<title>Kiska Kachra eval harness</title>
<!-- Loaded by tools/e2e.mjs. Runs the exact recognizer the app uses. -->
<script type="module">
  import { Recognizer } from '../ai.js';

  window.setup = async (modelId, templates) => {
    const labels = await (await fetch('../data/labels.json')).json();
    if (templates === 'single') labels.brandPrompts = labels.brandPrompts.slice(0, 1);
    const t0 = performance.now();
    // seed: false so the eval always exercises the on-device text encoder too.
    window.rec = new Recognizer({ labels, modelId, seed: false });
    await window.rec.init();
    // What a phone downloads: the vision side only (text embeddings are shipped precomputed).
    const visionBytes = Object.entries(window.rec.files)
      .filter(([f]) => !/text_model|tokenizer|vocab|merges|special_tokens/.test(f))
      .reduce((a, [, [, total]]) => a + total, 0);
    return { initMs: performance.now() - t0, brands: labels.brands.length, visionMB: visionBytes / 1e6 };
  };

  window.classify = async (dataURL) => {
    const r = await window.rec.classify(dataURL);
    return { brands: r.brands.slice(0, 5), items: r.items.slice(0, 3), ms: r.ms };
  };
  window.exportEmbeddings = () => window.rec.exportEmbeddings();
  window.harnessReady = true;
</script>
